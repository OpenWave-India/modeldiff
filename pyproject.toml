[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# "modeldiff" is already taken on PyPI by an unrelated project (MadryLab/modeldiff),
# so the distribution name is prefixed. The import name and CLI are `modeldiff`.
name = "openwave-modeldiff"
version = "0.2.0"
description = "Regression testing for local AI: compare model outputs across versions, configurations, and runtimes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenWave India" }]
keywords = ["llm", "regression-testing", "evaluation", "ollama", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
memory = ["psutil>=5.9"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
modeldiff = "modeldiff.cli:main"

[project.urls]
Repository = "https://github.com/OpenWave-India/modeldiff"
Documentation = "https://github.com/OpenWave-India/modeldiff#readme"
Issues = "https://github.com/OpenWave-India/modeldiff/issues"
Changelog = "https://github.com/OpenWave-India/modeldiff/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is handled by `ruff format`; long strings and messages are left intact.
ignore = ["E501"]
